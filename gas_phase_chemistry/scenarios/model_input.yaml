# =====================================================================================
# Complete, self-contained input file for the gas-phase chemistry box model
# (coupled to the TUV-x photolysis port).
#
# Everything needed to run a case is here: environment, location, date/time, the run
# schedule, and the FULL initial composition. Edit the values and run:
#
#     cd gas_phase_chemistry
#     python run_example.py --config scenarios/model_input.yaml
#
# (or in code:  Scenario.load("scenarios/model_input.yaml") -> .to_config()/.initial_state())
# =====================================================================================

# --- environment ---
T:      210        # temperature (K)
P:      68         # pressure (mbar)  [also sets the box altitude ~19-20 km for photolysis]
SA:     2          # aerosol surface-area density (um^2/cm^3)
WTR:    5          # water vapour (ppm)  [used by the O(1D)/HO2 chemistry; keep consistent with H2O below]
Yn2o5:  0.1        # N2O5 + H2O uptake coefficient (gamma)
opt:    1          # O3-photolysis mode (1 = Science-paper O(1D) workaround)

# --- location & date/time (drive the solar zenith angle -> photolysis) ---
latitude:        0.0    # degrees North
longitude:       0.0    # degrees East
day_of_year:     80     # 1..365   (time of year; 80 ~ equinox)
start_utc_hour:  6.0    # UTC hour at model time t = 0   (time of day at the start)

# --- run schedule ---
td:    14      # daytime segment length (hours)  [used only in 'reference' mode]
tn:    10      # nighttime segment length (hours) [used only in 'reference' mode]
days:  10      # number of days to simulate
DT:    600     # output time step (seconds)

# --- output ---
output_dir: plots           # folder for the per-species trend plots (refreshed on every run)

# --- photolysis driver ---
#   reference : fixed 45-deg J-values, on by day / off by night (MATLAB-faithful)
#   sza       : reference J-values scaled by the real solar zenith angle
#   tuvx      : absolute per-reaction J from the TUV-x (JAX) radiation port at the box altitude
photolysis: tuvx

# --- initial composition (pptv = parts per trillion by volume) ---
# The FULL initial state. Any species omitted starts at 0. These values are used directly
# (they take precedence over the built-in pressure-level preset), so this file is self-contained.
concentrations:
  # --- background / long-lived ---   (note: YAML needs a signed exponent, e.g. 2.1e+11)
  O2:      2.1e+11    # 21% of air
  O3:      1.18e+6    # ~1.18 ppmv
  CH4:     1.6e+6     # 1.6 ppmv
  H2O:     5.0e+6     # 5 ppmv (match WTR above)
  C2H6:    200
  SO2:     953895     # ~0.95 ppbv
  # --- chlorine ---
  Cl:      0
  ClO:     10
  ClOOCl:  0
  ClONO2:  127
  HCl:     777
  Cl2:     0
  HOCl:    0
  OClO:    0
  # --- nitrogen ---
  "NO":    450          # quoted: unquoted NO is the YAML boolean false
  NO2:     450
  NO3:     0
  N2O5:    20
  HNO3:    0
  HNO4:    0
  HONO:    0
  HNO3aq:  0
  # --- bromine ---
  Br:      0
  BrO:     0
  BrONO2:  0
  BrCl:    0
  HBr:     0
  HOBr:    0
  # --- odd oxygen / HOx ---
  O:       0
  O1D:     0
  OH:      0.5
  HO2:     3
  H2O2:    0
  CH3:     0
