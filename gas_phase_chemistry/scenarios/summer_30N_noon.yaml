# =====================================================================================
# Scenario: 30 deg N, northern-summer solstice (day 172), starting at LOCAL NOON.
# Thermodynamics held at the 55 hPa / 210 K / 4 ppm parcel; only location/season/start
# time change. longitude=0 + start_utc_hour=12 places t=0 at solar noon (SZA ~6.6 deg).
# Run:  python compare_o3_tuvx.py --config scenarios/summer_30N_noon.yaml --out o3_tuvx_summer_30N
# =====================================================================================

# --- environment ---
T:      210        # temperature (K)
P:      55         # pressure (mbar / hPa)  [box altitude ~20-21 km]
SA:     2          # aerosol surface-area density (um^2/cm^3)
WTR:    4          # water vapour (ppm)  [consistent with H2O below]
Yn2o5:  0.1        # N2O5 + H2O uptake coefficient (gamma)
opt:    1          # O3-photolysis mode (1 = Science-paper O(1D) workaround)

# --- location & date/time ---
latitude:        30.0   # degrees North
longitude:       0.0    # degrees East (UTC meridian -> solar noon at UTC 12)
day_of_year:     172    # ~ June 21, northern summer solstice
start_utc_hour:  12.0   # local solar noon at longitude 0

# --- run schedule ---
td:    14
tn:    10
days:  10
DT:    600

# --- output ---
output_dir: plots_summer_30N

# --- photolysis driver ---
photolysis: tuvx

# --- initial composition (pptv) ---
concentrations:
  O2:      2.1e+11
  O3:      1.18e+6
  CH4:     1.6e+6
  H2O:     4.0e+6     # 4 ppm (matches WTR above)
  C2H6:    200
  SO2:     953895
  Cl:      0
  ClO:     10
  ClOOCl:  0
  ClONO2:  127
  HCl:     777
  Cl2:     0
  HOCl:    0
  OClO:    0
  "NO":    450
  NO2:     450
  NO3:     0
  N2O5:    20
  HNO3:    0
  HNO4:    0
  HONO:    0
  HNO3aq:  0
  Br:      0
  BrO:     0
  BrONO2:  0
  BrCl:    0
  HBr:     0
  HOBr:    0
  O:       0
  O1D:     0
  OH:      0.5
  HO2:     3
  H2O2:    0
  CH3:     0
