# Alembic configuration for Plume Studio's run-metadata database.
#
#     alembic -c studio/store/alembic.ini upgrade head
#     alembic -c studio/store/alembic.ini revision --autogenerate -m "what changed"
#
# The URL is deliberately NOT set here: it comes from STUDIO_DATABASE_URL (or the local SQLite
# default) via studio.store.engine, so one configuration works for a developer machine, CI, and a
# Postgres deployment without editing a file that is committed.
[alembic]
script_location = studio/store/migrations
prepend_sys_path = .
# explicit, or alembic warns and falls back to splitting on spaces, commas and colons
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
