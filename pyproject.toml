[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-coupled"
version = "0.1.0"
description = "Coupled SAI plume box model: TUV-x photolysis (tuvx-jax) + stratospheric chemistry (stratchem-jax) + TOMAS microphysics (tomas-jax), wired by the coupled/ driver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# core: the TUV-x photolysis port + the gas-phase chemistry box model (NumPy/SciPy) it drives
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "netCDF4>=1.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",     # run the coupled suite across cores: pytest coupled/tests -n auto
    "pytest-timeout>=2.1",   # cap any single test (catches a hung coupled run): --timeout=300
    "matplotlib>=3.7",
]
# the chemistry model's optional differentiable (Diffrax) Phase-B solver (gas_phase_chemistry/jaxmodel)
jax-chemistry = [
    "diffrax>=0.5",
    "equinox>=0.11",
    "optax>=0.2",
    "optimistix>=0.0.6",
    "lineax>=0.0.4",
]
# Plume Studio: the configure/run/compare front-end over the coupled model (studio/, docs/studio/).
# Deliberately lightweight -- SQLite + an in-process worker pool, no Redis/Celery/Docker in Phase 0
# (docs/studio/adr/ADR-007-stack.md). Alembic is here from the first migration so that moving to
# Postgres is a connection-string change rather than a rewrite.
studio = [
    "pydantic>=2.7",
    "pint>=0.23",            # units at the presentation boundary only, never inside the model call
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sse-starlette>=2.0",    # progress is pushed (spec 7.3), not polled
    "typer>=0.12",           # CLI: scripted ensembles must not require the browser
]
# studio linting/typing; separate from `dev` so the model's suite is unaffected
studio-dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.3",
    "hypothesis>=6.100",     # property tests for unit round-trips across the valid T-p range
]

# the models themselves live in the tuvx-jax / stratchem-jax / tomas-jax git submodules
# (put on sys.path by coupled/model_bridge.py and coupled/tomas_bridge.py); this project
# installs the coupling layer + shared dependencies.
[tool.setuptools.packages.find]
where = ["."]
include = ["coupled*", "studio*"]
exclude = ["coupled.paper_ensemble.runs*", "studio.tests*", "studio.web*"]

[tool.pytest.ini_options]
# NOTE: testpaths stays coupled/tests deliberately -- CLAUDE.md documents separate suites per
# component, and Studio is a fourth. Run it explicitly: pytest studio/tests -m tier_a
testpaths = ["coupled/tests"]
markers = [
    "slow: end-to-end runs that invoke the real TOMAS microphysics or TUV-x port (deselect with -m 'not slow')",
    "tier_a: studio -- fast checks plus one short real run; runs in CI on every commit (ADR-009)",
    "tier_b: studio -- full-case golden reproduction against the archived ensemble; minutes, nightly/manual (ADR-009)",
]

# ----------------------------------------------------------------------------------------------
# Plume Studio tooling. Scoped to studio/ so the model's existing style is left alone.
# ----------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Studio's floor is 3.12, not the model's >=3.10: the lockfile is compiled for 3.12, CI runs 3.12,
# and numpy's bundled type stubs use 3.12-only `type` statements, so mypy cannot check this package
# against anything older. All three tools state the same floor deliberately.
target-version = "py312"
src = ["."]
extend-exclude = ["studio/web"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "UP",        # pyupgrade
    "ANN",       # missing annotations -- mypy --strict enforces the rest
    "RUF",
]
# ARG/ANN on tests would fight pytest fixtures; ANN401 (typed **kwargs as Any) is not worth the noise
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"studio/tests/**" = ["ANN"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "studio/web"

[tool.mypy]
python_version = "3.12"
# --strict is applied to studio/schema and studio/science on the command line and in CI; the settings
# here are the baseline for everything else under studio/.
files = ["studio"]
exclude = ["studio/web/", "studio/tests/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The model is untyped and is not ours to annotate; studio/modelio is the only importer (ADR-001).
# `follow_imports = "silent"` matters as much as ignore_missing_imports: once studio/modelio imports
# `coupled`, mypy would otherwise report errors from the MODEL's source (its own untyped deps --
# yaml, scipy, the flat `aerosol` module), which are not Studio's to fix and would make the check
# unusable. Studio's own use of those imports is still checked.
module = [
    "coupled.*",
    "config",
    "aerosol",
    "background_aerosol_distribution",
    "tomas_jax.*",
    "tuvx_photolysis.*",
    "yaml",
    "scipy.*",
]
ignore_missing_imports = true
follow_imports = "silent"
